*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d14;font-family:'Poppins','Segoe UI',Roboto,Arial,sans-serif;color:#f4f4fa}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;background:#12121b;overflow:hidden}
#stage>*,#dyn>*{position:absolute}
.cd>*,.pn>*{position:absolute}
.lb{font-size:17px;font-weight:600;color:#6f7087;white-space:nowrap}
.mut{color:#8b8ca1}
.up{color:#4fd06e;font-weight:600}.dn{color:#e8705f;font-weight:600}
.cd{border-radius:26px;overflow:hidden}
.ct{font-size:14px;font-weight:600;color:#9a9bb0;white-space:nowrap}
svg{display:block;overflow:visible}
svg text{font-family:'Poppins','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:36px;line-height:36px;text-align:center;border-radius:12px;background:#1f202b;color:#9a9bb0;font-size:12.5px;font-weight:600;cursor:pointer}
.lang:hover{color:#fff}.lang.on{background:#6f5ccf;color:#fff}
.nav{width:112px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav svg{opacity:.55}.nav:hover svg{opacity:1}.nav.on svg{opacity:1}
.chip{display:flex;align-items:center;justify-content:center;height:32px;border-radius:10px;background:#2b2c3a;border:1px solid #3b3c50;color:#b4b5c8;font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{border-color:#8c7df0;color:#fff}
.chip.on{background:#6f5ccf;border-color:#6f5ccf;color:#fff;font-weight:600}
.chip.all{background:#4a4287;border-color:#4a4287;color:#e9e6ff}
.chip.na{background:#262734;color:#53546a;border-color:#2e2f3e;cursor:default}
.btn{display:flex;align-items:center;justify-content:center;height:32px;border-radius:10px;border:1px solid #6f5ccf;background:transparent;color:#d9d3ff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#6f5ccf;color:#fff}.btn.fill{background:#6f5ccf;color:#fff}.btn.fill:hover{background:#8472e6}
.pill{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;border:1px solid #3b3c50;background:#2c2d3b;color:#e8e8f5;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}
.pill:hover{background:#6f5ccf;border-color:#6f5ccf;color:#fff}
.pill.yt{background:rgba(230,33,23,.14);border-color:rgba(230,33,23,.40);color:#f0766e}.pill.li{background:rgba(10,102,194,.18);border-color:rgba(10,102,194,.50);color:#6fb0ee}.pill.pf{background:rgba(240,182,74,.13);border-color:rgba(240,182,74,.38);color:#e6bd6a}.pill.wa{background:rgba(31,168,85,.15);border-color:rgba(31,168,85,.42);color:#5fcf8c}.pill.yt:hover{background:rgba(230,33,23,.30)}.pill.li:hover{background:rgba(10,102,194,.36)}.pill.pf:hover{background:rgba(240,182,74,.28)}.pill.wa:hover{background:rgba(31,168,85,.30)}
.kp{cursor:pointer}.kp:hover{outline:1.5px solid #6f5ccf;outline-offset:-1.5px}
.tr{display:flex;align-items:center;border-radius:10px;cursor:pointer;border:1px solid transparent;font-size:13px}
.tr:hover{background:#2f3040}.tr.on{background:rgba(111,92,207,.26);border-color:#6f5ccf}.tr.dim{opacity:.45}
.tr>*{position:absolute}
.hit{pointer-events:auto;cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#1b1c26;border:1px solid #6f5ccf;color:#fff;font:600 12.5px 'Poppins','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(6,6,10,.84);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1240px,94vw);height:min(720px,88vh);background:#1a1b25;border:1px solid #6f5ccf;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;font-family:'Poppins','Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#23242f;border-bottom:1px solid #34354a}
#sheet .tp b{flex:1;font-size:16px;color:#fff}
#sheet button{height:30px;padding:0 14px;border:1px solid #6f5ccf;border-radius:15px;background:#2a2b38;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#6f5ccf}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#23242f;color:#f2f2f8;padding:6px 9px;text-align:right;white-space:nowrap;border:1px solid #3a3b50}
#sheet td{padding:4px 9px;border:1px solid #2b2c3b;text-align:right;color:#e2e2ee;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#1f2029}
#sheet td[contenteditable]:focus{outline:2px solid #8c7df0;background:#2f2a52}
#q{position:absolute;left:18px;top:0;width:310px;height:44px;border:0;background:transparent;color:#e8e8f5;font:500 13.5px 'Poppins','Segoe UI',Arial;outline:none}
#q::placeholder{color:#8b8ca1}
</style></head>
